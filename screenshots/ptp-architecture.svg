  <text x="560" y="190" fill="#34d399" font-family="monospace" font-size="11">G.8275.1 L2 Multicast (Domain 24) &bull; Asymmetry Calibrated</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#071b2d" stroke="#38bdf8" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ENTERPRISE TELECOM GUARANTEES:</text>
