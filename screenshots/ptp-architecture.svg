  <text x="560" y="305" fill="#bae6fd" font-family="-apple-system, sans-serif" font-size="11">&bull; Master Guard filter drops unauthorized Announce packets unconditionally</text>
  <text x="560" y="335" fill="#bae6fd" font-family="-apple-system, sans-serif" font-size="11">&bull; Static fiber asymmetry offset (45ns) eliminates optical delay bias</text>
  <text x="560" y="365" fill="#bae6fd" font-family="-apple-system, sans-serif" font-size="11">&bull; OCXO / Rubidium oscillator provides &lt;1.5us holdover budget for 8–24 hours</text>
  <text x="560" y="415" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">IEEE 1588-2008 &bull; ITU-T G.8275.1 &bull; CISCO, JUNIPER, ARISTA &amp; PTP4L</text>
